services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: quickgent-api
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_started
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  engine:
    build:
      context: ./apps/engine
      dockerfile: Dockerfile
    container_name: quickgent-engine
    ports:
      - "8000:8000"
    env_file:
      - ./apps/engine/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/engine/src:/app/src

  postgres:
    image: postgres:17-alpine
    container_name: quickgent-postgres
    env_file:
      - ./apps/api/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quickgent-redis
    env_file:
      - ./apps/api/.env
    command: [ "sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD --appendonly yes" ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
